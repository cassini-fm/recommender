services:
  recommender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cassini-recommender
    environment:
      DATABASE_URL: postgresql://recommender:${RECOMMENDER_DB_PASSWORD:-cassini}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cassini}
    restart: unless-stopped
    networks:
      - db

networks:
  db:
    name: cassini_db
    external: true
